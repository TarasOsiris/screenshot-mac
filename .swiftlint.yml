# Opt-in only. This codebase predates any linter, so an "all rules on" config would produce
# thousands of findings and be switched off within a day. These are rules that either encode
# something CLAUDE.md already states in prose, or have a small enough baseline to fix as you go.
# NOTE: `only_rules` cannot be combined with `disabled_rules`/`opt_in_rules` — SwiftLint
# discards the whole config and silently falls back to its defaults if you try.
only_rules:
  - custom_rules
  - force_cast
  - force_try
  - force_unwrapping
  - implicitly_unwrapped_optional
  - empty_count
  - unused_import
  - implicit_optional_initialization
  - redundant_nil_coalescing
  - toggle_bool
  - sorted_imports
  - no_space_in_method_call
  - file_length
  - type_body_length
  - vertical_whitespace
  - closing_brace
  - colon
  - comma
  - trailing_newline
  - control_statement
  - opening_brace

# This target builds with SWIFT_APPROACHABLE_CONCURRENCY, under which a bare `nonisolated async
# func` inherits the *caller's* executor: called from @MainActor code it runs on the main thread,
# and with no suspension point in its body the `await` doesn't even yield. That shipped as a
# multi-second app hang in 4.0 (108) (Sentry SCREENSHOT-BRO-2/-3). `@concurrent` is what actually
# offloads. Legitimate exceptions exist — a body that is itself a `Task.detached`, or a function
# that must touch a non-Sendable value on the caller's actor before delegating — so this is an
# error you silence per-site with a reason, not a rule you argue with in review.
custom_rules:
  inherited_executor_async:
    name: "Inherited Executor"
    regex: '^\s*(?:@discardableResult\s+)?(?:public |internal |private |fileprivate )?nonisolated\s+(?:static\s+)?func\s+\w+[^\n]*\basync\b'
    message: "A bare `nonisolated async func` inherits the caller's executor and does not offload. Use @concurrent, or silence this with a reason."
    severity: error

included:
  - screenshot/Code
  - screenshotTests

# SwiftUI bodies and the device-frame renderers are legitimately long; warn well above the
# current worst file so the rule flags growth rather than the status quo.
file_length:
  warning: 1000
  error: 1500
  ignore_comment_only_lines: true

type_body_length:
  warning: 900
  error: 1300

force_unwrapping:
  severity: warning

