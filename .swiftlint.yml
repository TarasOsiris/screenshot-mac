# Opt-in only. This codebase predates any linter, so an "all rules on" config would produce
# thousands of findings and be switched off within a day. These are rules that either encode
# something CLAUDE.md already states in prose, or have a small enough baseline to fix as you go.
# NOTE: `only_rules` cannot be combined with `disabled_rules`/`opt_in_rules` — SwiftLint
# discards the whole config and silently falls back to its defaults if you try.
only_rules:
  - force_cast
  - force_try
  - force_unwrapping
  - implicitly_unwrapped_optional
  - empty_count
  - unused_import
  - implicit_optional_initialization
  - redundant_nil_coalescing
  - toggle_bool
  - sorted_imports
  - no_space_in_method_call
  - file_length
  - type_body_length
  - vertical_whitespace
  - closing_brace
  - colon
  - comma
  - trailing_newline
  - control_statement
  - opening_brace

included:
  - screenshot/Code
  - screenshotTests

# SwiftUI bodies and the device-frame renderers are legitimately long; warn well above the
# current worst file so the rule flags growth rather than the status quo.
file_length:
  warning: 1000
  error: 1500
  ignore_comment_only_lines: true

type_body_length:
  warning: 900
  error: 1300

force_unwrapping:
  severity: warning

